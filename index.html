<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thông báo quan trọng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 50px;
        }
        img {
            max-width: 90%;
            height: auto;
            margin-bottom: 20px;
        }
        .message {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 20px;
            border-radius: 8px;
            display: inline-block;
            font-size: 20px;
            color: #856404;
        }
    </style>
</head>
<body>
    <h1>🔔 THÔNG BÁO 🔔</h1>
    <img src="https://imgur.com/a/uVqudnP" alt="Thông báo">
    <div class="message">
        chào mừng bạn đến với wed của anh chiến đa cấp!
    </div>
</body>
</html>
